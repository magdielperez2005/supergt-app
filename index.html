<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supermercado Online</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Supermercado</a></li>
        <li><a href="carrito.html">Carrito</a></li>
      </ul>
    </nav>
  </header>


  <main>
    <h1>Bienvenido</h1>
    <p>Explora nuestros productos. Añade lo que necesites a tu carrito y finaliza tu compra en la sección correspondiente.</p>

    <img src="img/LOGOORIGINAL.jpg" class="img-fluid" alt="...">

    <div class="d-flex align-items-center justify-content-between my-4 imagenes-con-texto">
        <img src="img/doritos_index.jpg" class="img-custom" alt="Imagen izquierda">
        
        <div class="texto-central">
          <h2>Promociones Especiales</h2>
          <p>¡No te pierdas las ofertas de esta semana!</p>
        </div>
      
        <img src="img/coca_index.jpg" class="img-custom" alt="Imagen derecha">
      </div>

    <div class="carousel">
      <div class="slides" id="slides">
        <div class="slide"><img src="img/agua_index.jpg" alt="Imagen 1" /></div>
        <div class="slide"><img src="img/publicidadcocacola.jpg" alt="Imagen 2" /></div>
        <div class="slide"><img src="img/chetos.png" alt="Imagen 3" /></div>
      </div>
    </div>

      
      
  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let index = 0;
    const slides = document.getElementById("slides");
    const totalSlides = slides.children.length;

    setInterval(() => {
      index = (index + 1) % totalSlides;
      slides.style.transform = `translateX(-${index * 100}%)`;
    }, 3000);
  </script>
</body>
</html>
